services:
  db:
    image: postgres:16-alpine
    container_name: glamgo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: glamgo
      POSTGRES_PASSWORD: glamgo_secret
      POSTGRES_DB: glamgo_db
    ports:
      - "5439:5432"
    volumes:
      - glamgo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glamgo -d glamgo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: glamgo_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - glamgo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: glamgo_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://glamgo:glamgo_secret@db:5432/glamgo_db"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "glamgo-super-secure-production-jwt-secret-key-cormorant-2026"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glamgo_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  glamgo_pgdata:
  glamgo_redisdata:
