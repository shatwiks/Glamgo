<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="GlamGo - Beauty Retail, At-Home Services, and Salon Discovery Platform">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1C1A" />
      <stop offset="55%" stop-color="#272320" />
      <stop offset="100%" stop-color="#161412" />
    </linearGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#E5C98B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1E1C1A" stop-opacity="0" />
    </radialGradient>
    <clipPath id="ruleClip">
      <rect x="64" y="40" width="240" height="5" />
    </clipPath>
    <style>
      .eyebrow { font: 600 12px 'Segoe UI', system-ui, sans-serif; letter-spacing: 3.5px; fill: #C5A059; }
      .brand { font: 500 54px Georgia, 'Times New Roman', serif; letter-spacing: 6px; fill: #F7F4EF; }
      .sub { font: 400 18px 'Segoe UI', system-ui, sans-serif; fill: #DDD6CC; }
      .pill-text { font: 600 12px 'Segoe UI', system-ui, sans-serif; fill: #F7F4EF; letter-spacing: 0.4px; }
      .stat-num { font: 700 22px 'Segoe UI', system-ui, sans-serif; fill: #E5C98B; }
      .stat-lbl { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #B7AEA2; letter-spacing: 1px; }
      @keyframes shimmer {
        0% { transform: translateX(-120px); opacity: 0.25; }
        50% { opacity: 1; }
        100% { transform: translateX(260px); opacity: 0.25; }
      }
      @keyframes pulseDot {
        0%, 100% { r: 4.5; opacity: 1; }
        50% { r: 7; opacity: 0.55; }
      }
      @keyframes floatSpark {
        0%, 100% { transform: translateY(0px); opacity: 0.9; }
        50% { transform: translateY(-4px); opacity: 1; }
      }
      .shimmer-bar { animation: shimmer 4.2s ease-in-out infinite; }
      .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
      .spark { animation: floatSpark 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="18" fill="url(#glow)" />
  <rect x="1.5" y="1.5" width="1197" height="317" rx="17" fill="none" stroke="#3D3630" stroke-width="1.5" />

  <!-- Subtle animated gold top accent rule -->
  <rect x="64" y="42" width="240" height="2" fill="#3A332C" />
  <g clip-path="url(#ruleClip)">
    <rect class="shimmer-bar" x="64" y="42" width="110" height="2" fill="url(#goldShimmer)" />
  </g>

  <text x="64" y="34" class="eyebrow">THREE EXPERIENCES · ONE PRODUCTION PLATFORM</text>

  <text x="64" y="112" class="brand">GLAMGO</text>
  <g transform="translate(356, 74)">
    <path class="spark" d="M10 0 L12.8 7.2 L20 10 L12.8 12.8 L10 20 L7.2 12.8 L0 10 L7.2 7.2 Z" fill="#C5A059" />
  </g>

  <text x="64" y="152" class="sub">Beauty retail meets instant booking — engineered for speed, scale &amp; tamper-proof payments.</text>

  <!-- Feature Pills -->
  <g transform="translate(64, 184)">
    <rect x="0" y="0" width="152" height="34" rx="17" fill="#2A2622" stroke="#474038" />
    <text x="76" y="21" text-anchor="middle" class="pill-text">Beauty E-Commerce</text>

    <rect x="164" y="0" width="166" height="34" rx="17" fill="#2A2622" stroke="#474038" />
    <text x="247" y="21" text-anchor="middle" class="pill-text">At-Home Specialists</text>

    <rect x="342" y="0" width="156" height="34" rx="17" fill="#2A2622" stroke="#474038" />
    <text x="420" y="21" text-anchor="middle" class="pill-text">Salon Reservations</text>

    <rect x="510" y="0" width="186" height="34" rx="17" fill="#2A2622" stroke="#474038" />
    <text x="603" y="21" text-anchor="middle" class="pill-text">Partner &amp; Admin Portals</text>
  </g>

  <!-- Bottom Metrics Strip -->
  <line x1="64" y1="244" x2="1136" y2="244" stroke="#35302B" stroke-width="1" />

  <g transform="translate(64, 276)">
    <circle cx="8" cy="-5" r="5" fill="#4ADE80" class="pulse-dot" />
    <text x="24" y="0" class="stat-num">LIVE</text>
    <text x="24" y="18" class="stat-lbl">VERCEL + RENDER</text>

    <text x="220" y="0" class="stat-num">2.6x – 7.3x</text>
    <text x="220" y="18" class="stat-lbl">FASTER CATALOG APIs</text>

    <text x="430" y="0" class="stat-num">346ms – 595ms</text>
    <text x="430" y="18" class="stat-lbl">RETURN PAGE RENDER</text>

    <text x="665" y="0" class="stat-num">62 / 62</text>
    <text x="665" y="18" class="stat-lbl">PYTEST CHECKS PASSING</text>

    <text x="880" y="0" class="stat-num">HMAC-SHA256</text>
    <text x="880" y="18" class="stat-lbl">RAZORPAY + ESCROW LEDGER</text>
  </g>
</svg>
