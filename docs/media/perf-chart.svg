<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-label="Before vs After Production API Latency Benchmark">
  <defs>
    <style>
      .card-bg { fill: #F7F4EF; stroke: #DFD8CE; stroke-width: 1.5; }
      .title { font: 700 20px Georgia, 'Times New Roman', serif; fill: #1E1C1A; }
      .subtitle { font: 500 12.5px 'Segoe UI', system-ui, sans-serif; fill: #665E57; }
      .ep { font: 600 13px Consolas, monospace; fill: #1E1C1A; }
      .val-before { font: 600 12px 'Segoe UI', system-ui, sans-serif; fill: #9D4E37; }
      .val-after { font: 700 12px 'Segoe UI', system-ui, sans-serif; fill: #1B5E20; }
      .gain { font: 700 11.5px 'Segoe UI', system-ui, sans-serif; fill: #8D6A2A; }
      .legend { font: 600 11.5px 'Segoe UI', system-ui, sans-serif; fill: #4A433D; }
      @keyframes growBar {
        0% { transform: scaleX(0.08); opacity: 0.4; }
        100% { transform: scaleX(1); opacity: 1; }
      }
      .bar-anim {
        transform-box: fill-box;
        transform-origin: left center;
        animation: growBar 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
    </style>
  </defs>

  <rect width="920" height="340" rx="14" class="card-bg" />
  <text x="32" y="40" class="title">Live Render Backend Latency: Before vs. After Optimization</text>
  <text x="32" y="62" class="subtitle">Warm persistent HTTPS keep-alive requests · Added selectinload + TTL cache + write invalidation + GZip (-58% to -64% wire size)</text>

  <!-- Legend -->
  <rect x="32" y="80" width="12" height="12" rx="3" fill="#B86B52" />
  <text x="50" y="90" class="legend">Before (N+1 queries, no fallback cache, uncompressed JSON)</text>
  <rect x="440" y="80" width="12" height="12" rx="3" fill="#2E7D32" />
  <text x="458" y="90" class="legend">After (Eager loading + TTL cache + GZip compression)</text>

  <!-- Row 1: /api/v1/products/ 2.206s -> 0.297s -->
  <text x="32" y="130" class="ep">/api/v1/products/</text>
  <rect x="230" y="114" width="520" height="12" rx="6" fill="#B86B52" class="bar-anim" />
  <text x="760" y="124" class="val-before">2.20s</text>
  <rect x="230" y="130" width="71" height="12" rx="6" fill="#2E7D32" class="bar-anim" />
  <text x="311" y="140" class="val-after">0.30s</text>
  <text x="820" y="132" class="gain">~7.3x faster</text>

  <!-- Row 2: /api/v1/salons/ 1.371s -> 0.265s -->
  <text x="32" y="184" class="ep">/api/v1/salons/</text>
  <rect x="230" y="168" width="323" height="12" rx="6" fill="#B86B52" class="bar-anim" />
  <text x="563" y="178" class="val-before">1.37s</text>
  <rect x="230" y="184" width="63" height="12" rx="6" fill="#2E7D32" class="bar-anim" />
  <text x="303" y="194" class="val-after">0.27s</text>
  <text x="820" y="186" class="gain">~5.1x faster</text>

  <!-- Row 3: /api/v1/professionals/ 0.823s -> 0.261s -->
  <text x="32" y="238" class="ep">/api/v1/professionals/</text>
  <rect x="230" y="222" width="194" height="12" rx="6" fill="#B86B52" class="bar-anim" />
  <text x="434" y="232" class="val-before">0.82s</text>
  <rect x="230" y="238" width="62" height="12" rx="6" fill="#2E7D32" class="bar-anim" />
  <text x="302" y="248" class="val-after">0.26s</text>
  <text x="820" y="240" class="gain">~3.1x faster</text>

  <!-- Row 4: /api/v1/services/ 0.807s -> 0.278s -->
  <text x="32" y="292" class="ep">/api/v1/services/</text>
  <rect x="230" y="276" width="190" height="12" rx="6" fill="#B86B52" class="bar-anim" />
  <text x="430" y="286" class="val-before">0.81s</text>
  <rect x="230" y="292" width="66" height="12" rx="6" fill="#2E7D32" class="bar-anim" />
  <text x="306" y="302" class="val-after">0.28s</text>
  <text x="820" y="294" class="gain">~2.9x faster</text>

  <text x="32" y="326" class="subtitle">Note: On warm cache hits (~0.26s–0.32s), database overhead is near zero; remaining time is India ↔ US-West (Render Oregon) TLS/HTTPS RTT.</text>
</svg>
