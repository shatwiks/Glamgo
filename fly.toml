# ==============================================================================
# GlamGo Fly.io Application Configuration (fly.toml)
# Edge deployment of Dockerized FastAPI backend with health monitoring
# ==============================================================================
app = "glamgo-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENVIRONMENT = "production"
  ENABLE_DOCS = "false"
  ACCESS_TOKEN_EXPIRE_MINUTES = "30"
  AUTO_MIGRATE = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health/live"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
