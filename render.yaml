# ==============================================================================
# GlamGo Luxury Beauty Marketplace — Render Blueprint Specification (render.yaml)
# Production Architecture: Docker FastAPI Backend connected to Cloud PostgreSQL (Neon)
# Frontend deployed on Vercel
# ==============================================================================

services:
  # FastAPI Backend Application (Docker Runtime on Free Tier — Zero Render DB Limits)
  - type: web
    name: glamgo-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: postgresql+psycopg://neondb_owner:npg_Q8tBn9UkTbOZ@ep-fragrant-grass-a11m3suu-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: REDIS_URL
        value: "" # Built-in graceful in-memory fallback
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_Tz5iDHtaEmqTCd
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        value: glamgo_prod_secret_2026
