# ==============================================================================
# GlamGo Luxury Beauty Marketplace — Render Blueprint Specification (render.yaml)
# Production Architecture: Docker FastAPI Backend connected to Cloud PostgreSQL
# Frontend deployed on Vercel
# ==============================================================================

services:
  # FastAPI Backend Application (Docker Runtime — secrets supplied externally)
  - type: web
    name: glamgo-backend
    runtime: docker
    branch: release/54ba3db
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_DEV_OTP_ECHO
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM_NAME
        value: GlamGo
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: "" # Empty uses in-memory fallback (valid only when WEB_CONCURRENCY=1)
      - key: REDIS_REQUIRED
        value: "false" # Set to "true" when scaling WEB_CONCURRENCY > 1 with managed Redis
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WHATSAPP_CONCIERGE_NUMBER
        value: "916360849512"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: INTERNAL_MAINTENANCE_TOKEN
        generateValue: true
