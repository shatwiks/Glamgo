# ==============================================================================
# GlamGo Luxury Beauty Marketplace — Render Blueprint Specification (render.yaml)
# Backend Architecture: Managed Postgres 16 (Free Tier) + Docker FastAPI (Free Tier)
# Note: Frontend is deployed separately on Vercel
# ==============================================================================

databases:
  # 1. Managed PostgreSQL 16 (Render Free Tier — 1GB Storage, No Card Required)
  - name: glamgo-postgres
    databaseName: glamgo_db
    user: glamgo
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # 2. FastAPI Backend Application (Docker Runtime on Free Tier — No Card Required)
  - type: web
    name: glamgo-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glamgo-postgres
          property: connectionString
      - key: REDIS_URL
        value: "" # Built-in graceful in-memory fallback
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
