# ==============================================================================
# GlamGo Luxury Beauty Marketplace — Render Blueprint Specification (render.yaml)
# Production Architecture: Docker FastAPI Backend connected to Cloud PostgreSQL (Neon)
# Frontend deployed on Vercel
# ==============================================================================

services:
  # FastAPI Backend Application (Docker Runtime on Free Tier — Zero Render DB Limits)
  - type: web
    name: glamgo-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Enter your Neon PostgreSQL connection string
      - key: REDIS_URL
        value: "" # Built-in graceful in-memory fallback
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
