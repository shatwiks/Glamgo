# ==============================================================================
# GlamGo Luxury Beauty Marketplace — Render Blueprint Specification (render.yaml)
# 100% Free Tier Deployment: Managed Postgres 16 (Free) + Docker FastAPI (Free) + Static Frontend (Free)
# Zero Credit Card Required
# ==============================================================================

databases:
  # 1. Managed PostgreSQL 16 (Render Free Tier — 1GB Storage, No Card Required)
  - name: glamgo-postgres
    databaseName: glamgo_db
    user: glamgo
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # 2. FastAPI Backend Application (Docker Runtime on Free Tier — No Card Required)
  - type: web
    name: glamgo-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glamgo-postgres
          property: connectionString
      - key: REDIS_URL
        value: "" # Graceful in-memory fallback (or paste free Upstash Redis URL)
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # 3. Vite SPA Frontend (Static Site on Global Edge CDN — Free Tier)
  - type: web
    name: glamgo-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to https://glamgo-backend.onrender.com/api/v1
